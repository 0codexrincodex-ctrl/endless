<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Skill - Select Character</title>
    <link rel="stylesheet" href="styles/tailwind.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="tw-page-body" data-page="menu">
    <main class="shell tw-page-shell">
      <section class="game-frame select-frame tw-game-frame" aria-label="Character select">
        <canvas id="game-canvas" class="tw-full-canvas" width="1280" height="720"></canvas>

        <div class="overlay select-overlay">
          <div class="select-scene">
            <div class="select-backdrop"></div>
            <div class="select-tree select-tree-left"></div>
            <div class="select-tree select-tree-mid"></div>
            <div class="select-tree select-tree-right"></div>
            <div class="select-fog select-fog-left"></div>
            <div class="select-fog select-fog-right"></div>

            <section class="select-shell">
              <header class="select-head">
                <div class="select-head-copy">
                  <h1>choose your survivor</h1>
                </div>
              </header>

              <div class="select-layout">
                <section class="select-list-card">
                  <div class="select-card-head">
                    <h2>Archive</h2>
                  </div>
                  <div class="archive-slot-list" id="slot-list"></div>
                </section>

                <aside class="select-detail-card">
                  <div class="select-card-head">
                    <h2 id="selection-title">-</h2>
                  </div>

                  <section class="select-focus-record" aria-label="Selected survivor details">
                    <div class="select-focus-portrait" aria-hidden="true">
                      <div class="select-focus-sprite"></div>
                    </div>
                    <div class="select-focus-body">
                      <div class="select-detail-meta" id="selection-meta"></div>
                      <p class="select-detail-copy" id="selection-summary"></p>
                    </div>
                  </section>

                  <div class="archive-selection-actions">
                    <button class="primary-button" id="start-btn" type="button">Create</button>
                    <button class="secondary-button" id="cycle-btn" type="button">Next</button>
                    <button class="danger-button" id="delete-btn" type="button" hidden>Delete</button>
                  </div>
                </aside>
              </div>
            </section>

            <div class="select-delete-modal" id="delete-modal" hidden>
              <div class="select-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
                <h2 id="delete-modal-title">erase this record?</h2>
                <div class="archive-selection-actions select-delete-actions">
                  <button class="danger-button" id="delete-confirm-btn" type="button">Delete</button>
                  <button class="secondary-button" id="delete-cancel-btn" type="button">Keep</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="js/systems/play.js"></script>
    <script src="js/systems/pages.js"></script>
    <script src="js/bootstrap.js"></script>
  </body>
</html>
