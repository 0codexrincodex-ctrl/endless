<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Skill - Random Skill Ritual</title>
    <link rel="stylesheet" href="styles/tailwind.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="tw-page-body" data-page="ritual">
    <main class="shell tw-page-shell">
      <section class="game-frame ritual-frame tw-game-frame" aria-label="Skill ritual">
        <canvas id="game-canvas" class="tw-full-canvas" width="1280" height="720"></canvas>

        <div class="overlay ritual-overlay">
          <div class="ritual-scene">
            <div class="ritual-backdrop"></div>
            <div class="ritual-tree ritual-tree-left"></div>
            <div class="ritual-tree ritual-tree-mid"></div>
            <div class="ritual-tree ritual-tree-right"></div>
            <div class="ritual-fog ritual-fog-left"></div>
            <div class="ritual-fog ritual-fog-right"></div>

            <section class="ritual-shell ritual-shell--library">
              <header class="ritual-library-topbar">
                <div class="ritual-selected-head">
                  <div class="ritual-selected-sigil" id="ritual-sigil-preview" data-color="red" aria-hidden="true"></div>
                  <div class="ritual-selected-copy">
                    <h1 id="ritual-core-title">choose your skill</h1>
                  </div>
                </div>

                <label class="ritual-search-field" aria-label="Search skills">
                  <input id="ritual-search-input" type="search" placeholder="Search" autocomplete="off" />
                </label>
              </header>

              <div class="ritual-library-layout">
                <article class="ritual-info-column">
                  <div class="ritual-detail-card">
                    <div class="ritual-detail-meta">
                      <span class="ritual-detail-type" id="ritual-detail-type">-</span>
                      <span class="ritual-detail-category" id="ritual-detail-category">-</span>
                    </div>
                    <h2 id="ritual-detail-name">-</h2>
                    <dl class="ritual-detail-stats">
                      <div>
                        <dt>Trigger</dt>
                        <dd id="ritual-detail-trigger">-</dd>
                      </div>
                      <div>
                        <dt>Effect</dt>
                        <dd id="ritual-detail-effect">-</dd>
                      </div>
                      <div>
                        <dt>Scaling</dt>
                        <dd id="ritual-detail-scaling">-</dd>
                      </div>
                      <div>
                        <dt>Chaos</dt>
                        <dd id="ritual-detail-chaos">-</dd>
                      </div>
                    </dl>
                  </div>

                  <div class="ritual-filter-bar" id="ritual-slot-indicator-bar"></div>
                </article>

                <section class="ritual-grid-column">
                  <div class="ritual-library-card">
                    <div class="ritual-skill-library" id="ritual-skill-grid"></div>
                  </div>
                </section>
              </div>

              <footer class="ritual-library-bottom">
                <div class="ritual-slot-bar" id="ritual-slot-bar"></div>

                <div class="ritual-action-row">
                  <button class="secondary-button" id="ritual-equip-btn" type="button">Set</button>
                  <button class="secondary-button" id="ritual-back-btn" type="button">Back</button>
                  <button class="primary-button" id="ritual-accept-btn" type="button">Start</button>
                  <button class="secondary-button" id="ritual-reroll-btn" type="button" hidden>Reroll</button>
                </div>
              </footer>

              <div class="ritual-hidden-bindings" hidden aria-hidden="true">
                <span id="ritual-reroll-status">slot 1</span>
                <strong id="ritual-core-title-visual">choose your skill</strong>
                <span id="ritual-reroll-status-visual">slot 1</span>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="js/systems/play.js"></script>
    <script src="js/systems/pages.js"></script>
    <script src="js/bootstrap.js"></script>
  </body>
</html>
