<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Skill - Main Menu</title>
    <link rel="stylesheet" href="styles/tailwind.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="tw-page-body" data-page="main">
    <main class="shell tw-page-shell">
      <section class="game-frame main-menu-frame tw-game-frame" aria-label="Main menu screen">
        <canvas id="game-canvas" class="tw-full-canvas" width="1280" height="720"></canvas>

        <div class="overlay main-menu-overlay">
          <div class="main-menu-scene">
            <div class="main-menu-backdrop"></div>
            <div class="main-menu-tree main-menu-tree-left"></div>
            <div class="main-menu-tree main-menu-tree-mid"></div>
            <div class="main-menu-tree main-menu-tree-right"></div>
            <div class="main-menu-fog main-menu-fog-left"></div>
            <div class="main-menu-fog main-menu-fog-right"></div>
            <div class="main-menu-ground"></div>

            <section class="main-profile-card" aria-label="Latest survivor overview">
              <div class="main-profile-frame">
                <div class="main-profile-portrait"></div>
                <div class="main-profile-level">6</div>
              </div>

              <div class="main-profile-data">
                <div class="main-profile-bar">
                  <span class="main-profile-bar-fill"></span>
                </div>
                <p class="main-profile-name">Narea</p>
              </div>
            </section>

            <section class="main-economy-panel" aria-label="Resources and perks">
              <div class="main-economy-bar">
                <div class="main-economy-item">
                  <span class="main-economy-gem main-economy-gem-green"></span>
                  <strong>12</strong>
                </div>
                <div class="main-economy-item">
                  <span class="main-economy-gem main-economy-gem-blue"></span>
                  <strong>48</strong>
                </div>
                <div class="main-economy-item">
                  <span class="main-economy-coin"></span>
                  <strong>200</strong>
                </div>
                <button class="main-economy-action" type="button" aria-label="Add currency"><span>+</span></button>
                <button class="main-economy-action is-alert" type="button" aria-label="Alerts"><span>!</span></button>
              </div>
            </section>

            <section class="main-title-block" aria-label="Game title">
              <h1>Endless Skill</h1>
              <div class="main-title-divider">
                <span></span>
              </div>
            </section>

            <nav class="main-action-stack" aria-label="Main menu">
              <button class="main-action-button" id="main-start-btn" type="button">New Game</button>
              <button class="main-action-button" id="main-archives-btn" type="button">Multiplayer</button>
              <button class="main-action-button" id="main-settings-btn" type="button">Settings</button>
              <button class="main-action-button" id="main-exit-btn" type="button">Exit Game</button>
            </nav>

            <section class="main-settings-panel" id="main-settings-panel" hidden aria-label="Audio settings">
              <div class="main-settings-shell">
                <div class="main-settings-head">
                  <p>Settings</p>
                  <h2>Game Audio</h2>
                </div>

                <div class="setting-block">
                  <label class="setting-row" for="master-volume">
                    <span>Master Volume</span>
                    <strong id="master-volume-value">72%</strong>
                  </label>
                  <input id="master-volume" class="setting-slider" type="range" min="0" max="100" step="1" />
                </div>

                <div class="setting-block">
                  <label class="setting-row" for="effects-volume">
                    <span>Effects</span>
                    <strong id="effects-volume-value">78%</strong>
                  </label>
                  <input id="effects-volume" class="setting-slider" type="range" min="0" max="100" step="1" />
                </div>

                <div class="setting-block">
                  <label class="setting-row" for="music-volume">
                    <span>Music</span>
                    <strong id="music-volume-value">54%</strong>
                  </label>
                  <input id="music-volume" class="setting-slider" type="range" min="0" max="100" step="1" />
                </div>

                <div class="setting-block">
                  <label class="setting-row" for="graphics-quality">
                    <span>Graphics</span>
                    <strong id="graphics-quality-value">Normal</strong>
                  </label>
                  <select id="graphics-quality" class="setting-select">
                    <option value="low">Low</option>
                    <option value="normal">Normal</option>
                    <option value="high">High</option>
                  </select>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="js/systems/stats.js"></script>
    <script src="js/systems/inventory.js"></script>
    <script src="js/systems/entities.js"></script>
    <script src="js/systems/damage.js"></script>
    <script src="js/systems/beam.js"></script>
    <script src="js/systems/combat.js"></script>
    <script src="js/systems/boss.js"></script>
    <script src="js/systems/play.js"></script>
    <script src="js/systems/pages.js"></script>
    <script src="js/bootstrap.js"></script>
  </body>
</html>
